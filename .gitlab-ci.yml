image: maven:3.9.11-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Xmx2g -Xms512m"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: overlay2
  DOCKER_REGISTRY: $NEXUS_REGISTRY_URL
  DOCKER_TLS_CERTDIR: ""
  NEXUS_USERNAME: darkstar2025
  NEXUS_PASSWORD: KaGu62Po!!!
  NEXUS_REGISTRY_URL: nexus.psychotor.local
  IMAGE_NAME: $DOCKER_REGISTRY/vicuna-hexa-kotlin:latest
  SONAR_HOSTNAME: $(echo $SONAR_HOST_URL | sed -e 's|^[^/]*//||' -e 's|/.*$||')

default:
  tags:
    - docker

cache:
  policy: pull-push
  key: "sonar-cache-$CI_COMMIT_REF_SLUG"
  paths:
    - "${SONAR_USER_HOME}/cache"

stages:
  - build_project
  - run_tests
  - handle_image

build:
  stage: build_project
  before_script:
    - export MAVEN_USER_HOME="$CI_PROJECT_DIR/.m2"
#    - mkdir -p "$MAVEN_USER_HOME/repository"
#    - chmod -R 0777 "$MAVEN_USER_HOME"
  script:
    - echo "Building the application..."
    - "mvn clean package -Dmaven.test.skip=true -Dquarkus.container-image.build=false"
  artifacts:
    paths:
      - target/quarkus-app/*.jar
      #- target/quarkus-app/lib/
      - target/quarkus-app/app
      #- target/quarkus-app/quarkus/
      #- target/site/
    expire_in: 1 week
  only:
    - develop-no-camel
    - develop
    - main

unit_test:
  stage: run_tests
  script:
    - echo "Running unit tests..."
    - "mvn clean test -Dquarkus.container-image.build=false"
  only:
    - develop-no-camel
    - develop
    - main
  allow_failure: true

int_test:
  stage: run_tests
  script:
    - echo "Running integration tests..."
    - "mvn verify -Pintegration"
  only:
    - main
  allow_failure: true

sonarqube:
  stage: run_tests
  script:
    - # 1. Use openssl s_client to fetch the full certificate chain from the SonarQube host
    - # It connects, prints the certs, ignores input, and extracts the PEM blocks.
    - |
    - echo "Fetching certificate chain from $SONAR_HOSTNAME..."
    - openssl s_client -showcerts -connect $SONAR_HOSTNAME:443 -servername $SONAR_HOSTNAME </dev/null 2>/dev/null |
    - sed -ne '/-BEGIN CERTIFICATE-/,/-END CERTIFICATE-/p' > /tmp/sonarqube_chain.pem

    - # 2. Verify the downloaded file has content
    - |
    - if [ ! -s /tmp/sonarqube_chain.pem ]; then
    - echo "Error: Failed to download certificate chain. Check connectivity to $SONAR_HOSTNAME:443."
    - exit 1
    - fi
    - echo "Certificate chain downloaded successfully."

    - # 3. Import the entire PEM bundle into the Java 'cacerts' truststore using keytool
    - echo "Importing certificate into JRE truststore..."
    - keytool -import -trustcacerts -keystore $JAVA_HOME/lib/security/cacerts -storepass changeit -alias sonarqube_ca_chain -file /tmp/sonarqube_chain.pem -noprompt

    - mvn -q sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
  only:
    - main
  allow_failure: true

image_build:
  stage: handle_image
  image: docker:20.10.16-dind
  services:
    - name: docker:20.10.16-dind
      alias: docker
  variables:
    DOCKER_AUTH_CONFIG: >
      {
        "auths": {
          "https://nexus.psychotor.local": {
            "auth": "Base64($NEXUS_USERNAME:$NEXUS_PASSWORD)"
          }
        }
      };
  script:
    - echo "Baue Docker-Image..."
    - echo "$NEXUS_PASSWORD" | docker login -u "$NEXUS_USERNAME" --password-stdin "$DOCKER_REGISTRY"
    - docker build -f src/main/docker/Dockerfile.jvm -t $DOCKER_REGISTRY/vicuna-hexa-kotlin:$CI_COMMIT_REF_NAME .
    - docker tag $DOCKER_REGISTRY/vicuna-hexa-kotlin:$CI_COMMIT_REF_NAME $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    - docker push $DOCKER_REGISTRY/vicuna-hexa-kotlin:$CI_COMMIT_REF_NAME
  only:
    - main

image_scan:
  stage: handle_image
  image: aquasec/trivy:latest
  services:
    - name: nexus.psychotor.local/custom-dind:latest
      alias: docker
  script:
    - echo "$NEXUS_PASSWORD" | docker login -u "$NEXUS_USERNAME" --password-stdin "$DOCKER_REGISTRY"
    - echo "Scanne Docker-Image mit Trivy..."
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  only:
    - main
  allow_failure: true

