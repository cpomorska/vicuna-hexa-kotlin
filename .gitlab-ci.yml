image: maven:3.9.14-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Xmx2g -Xms512m"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: overlay2
  DOCKER_REGISTRY: $NEXUS_REGISTRY_URL
  DOCKER_TLS_CERTDIR: ""
  NEXUS_USERNAME: darkstar2025
  NEXUS_PASSWORD: KaGu62Po!!!
  NEXUS_REGISTRY_URL: nexus.psychotor.local
  IMAGE_NAME: $DOCKER_REGISTRY/vicuna-hexa-kotlin:latest
  SONAR_HOSTNAME: $(echo $SONAR_HOST_URL | sed -e 's|^[^/]*//||' -e 's|/.*$||')

default:
  tags:
    - docker

cache:
  policy: pull-push
  key: "sonar-cache-$CI_COMMIT_REF_SLUG"
  paths:
    - "${SONAR_USER_HOME}/cache"

stages:
  - build_project
  - run_tests
  - handle_image

build:
  stage: build_project
  before_script:
    - export MAVEN_USER_HOME="$CI_PROJECT_DIR/.m2"
#    - mkdir -p "$MAVEN_USER_HOME/repository"
#    - chmod -R 0777 "$MAVEN_USER_HOME"
  script:
    - echo "Building the application..."
    - "mvn clean package -Dmaven.test.skip=true -Dquarkus.container-image.build=false"
  artifacts:
    paths:
      - target/quarkus-app/*.jar
      #- target/quarkus-app/lib/
      - target/quarkus-app/app
      #- target/quarkus-app/quarkus/
      #- target/site/
    expire_in: 1 week
  only:
    - develop-no-camel
    - develop
    - main

unit_test:
  stage: run_tests
  script:
    - echo "Running unit tests..."
    - "mvn clean test -Dquarkus.container-image.build=false"
  only:
    - develop-no-camel
    - develop
    - main
  allow_failure: true

int_test:
  stage: run_tests
  script:
    - echo "Running integration tests..."
    - "mvn verify -Pintegration"
  only:
    - main
  allow_failure: true

sonarqube:
  stage: run_tests
  before_script:
    # Use a literal block scalar and force the shell to be bash
    - echo "Fetching certificate chain from ..."
    - echo $(echo ${SONAR_HOST_URL#*//}):443
    # get sonar qube host cert
    - openssl s_client -showcerts -connect $(echo ${SONAR_HOST_URL#*//}):443 </dev/null 2>/dev/null | openssl x509 -outform PEM > sonarqube.crt
    - cat sonarqube.crt >> /usr/local/share/ca-certificates/scp.sonarqube.crt

    # 2. Import the certificate (Runs in the SAME process as step 1, but modifies the FS)
    - keytool -importcert -file /usr/local/share/ca-certificates/scp.sonarqube.crt -alias scp-sonarqube -cacerts -storepass changeit -noprompt -rfc
  script:
    # Gitlab CI might execute this as a new shell instance, ensuring a fresh JVM is spawned.
    - echo "Running Sonar analysis with updated truststore..."
    - mvn -q test sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml -Dsonar.projectKey=develop_vicuna-hexa-kotlin_6dbd0254-de00-4c97-b9a5-65e8af77847c -Dquarkus.container-image.build=false
  only:
    - develop
    - main
  allow_failure: true

image_build:
  stage: handle_image
  image: docker:29.3.0-dind
  services:
    - name: docker:29.3.0-dind
      alias: docker
  variables:
    DOCKER_AUTH_CONFIG: >
      {
        "auths": {
          "https://nexus.psychotor.local": {
            "auth": "Base64($NEXUS_USERNAME:$NEXUS_PASSWORD)"
          }
        }
      };
  script:
    - echo "Baue Docker-Image..."
    - echo "$NEXUS_PASSWORD" | docker login -u "$NEXUS_USERNAME" --password-stdin "$DOCKER_REGISTRY"
    - docker build -f src/main/docker/Dockerfile.jvm -t $DOCKER_REGISTRY/vicuna-hexa-kotlin:$CI_COMMIT_REF_NAME .
    - docker tag $DOCKER_REGISTRY/vicuna-hexa-kotlin:$CI_COMMIT_REF_NAME $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    - docker push $DOCKER_REGISTRY/vicuna-hexa-kotlin:$CI_COMMIT_REF_NAME
  only:
    - main

image_scan:
  stage: handle_image
  image: aquasec/trivy:latest
  services:
    - name: nexus.psychotor.local/custom-dind:latest
      alias: docker
  script:
    - echo "$NEXUS_PASSWORD" | docker login -u "$NEXUS_USERNAME" --password-stdin "$DOCKER_REGISTRY"
    - echo "Scanne Docker-Image mit Trivy..."
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  only:
    - main
  allow_failure: true

