#      - name: Build with Maven
#        run: mvn clean package -Dmaven.test.skip=true -Dquarkus.container-image.build=true

env:
  JAVA_OPTS: -Xmx2g

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 25
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build with Maven
        run: mvn clean package -Dmaven.test.skip=true -Dquarkus.container-image.build=false
